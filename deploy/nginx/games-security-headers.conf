# Security headers for the Dictionary Games site.
#
# GENERATED FILE — do not edit by hand.
# Source: scripts/generate-csp-headers.cjs + site-endpoints.cjs
# Regenerate with: pnpm run build:headers
#
# The CSP's connect-src below is derived from the SAME endpoint configuration
# the JS bundle is compiled with, so an override cannot reach one without
# reaching the other. Hand-editing this file will be reverted by the next
# regeneration, and CI fails when the committed copy does not match.
#
# WHY A SNIPPET RATHER THAN ONE SET ON THE SERVER BLOCK. Nginx's `add_header`
# does not merge: the moment a `location` adds a header of its own, it replaces
# the ENTIRE inherited set rather than adding to it. Every location in
# games-site.conf sets its own Cache-Control, so every location would silently
# lose the CSP and the framing protections — invisible until someone checks the
# response headers on a route rather than reading the config.
#
# So: this file holds the full set, and every location `include`s it. One
# source of truth, and adding a location cannot quietly drop protections.
#
# Included by absolute path, so this file must live at exactly
# /etc/nginx/conf.d/games-security-headers.conf in both the container image and
# a droplet install. A relative include resolves against nginx's prefix, which
# is not the same in both, so the absolute path is the portable choice here.
#
# TLS deployments: add Strict-Transport-Security to THIS file, not to the
# server block — for the add_header reason above, a server-block HSTS header is
# dropped from every response that a location touches.

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;

# The app needs none of these. Denying them means an injected script cannot
# reach for them either.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# CSP. `connect-src` is the load-bearing line: it names exactly the origins
# this build talks to, so an injected script cannot exfiltrate a suite token to
# an attacker's host even if it manages to read one out of memory.
#
#   script-src 'self'   — no CDN, no inline <script>, no eval. The build
#                         inlines nothing; html-webpack-plugin emits external
#                         <script src> tags only.
#   style-src            — 'unsafe-inline' is required by the style attributes
#                         React and Tailwind's preflight emit. It does not
#                         extend to scripts.
#   media-src https:     — dictionary pronunciation audio (`audio_url`) may be
#                         served from a media/CDN host distinct from the API
#                         host, so it cannot be pinned to one origin here.
#   img-src data:        — inline SVG/data-URI icons from lucide-react.
#   frame-ancestors      — this app is never framed; clickjacking has no room.
#   form-action 'none'   — the sign-in form submits with fetch(), never a real
#                         form POST, so nothing should navigate to a form
#                         target.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self' https:; connect-src 'self' https://dictionary.sparxstar.com https://id.sparxstar.com https://rlc-api.sparxstar.com; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
