# games.sparxstar.com — static host for the Dictionary Games site.
#
# Serves the output of `pnpm run build:site` (dist-site/) plus ONE proxied
# location: `/api/dictionary/`, which reaches the games BFF.
#
# THE BFF EXISTS BECAUSE THE DICTIONARY API IS PRIVATE. No browser, anonymous
# user, or unregistered application may call it. So the page calls this origin,
# same-origin, and the BFF — a separate container holding the Identity Node
# signing key — authenticates itself and calls the Dictionary. The credential
# is never in this image and never in the bundle.
#
# The browser still talks directly to id.sparxstar.com and rlc-api.sparxstar.com,
# which answer CORS from their own origin allowlists. This host must never add
# CORS headers of its own — two sources of truth for an allowlist is how an
# origin ends up permitted that the API rejects (the same rule the engine's
# deploy/nginx/rlc-engine.conf states). The `/api/dictionary/` hop needs no
# CORS at all, which is the point of it being same-origin.
#
# Requires deploy/nginx/games-security-headers.conf installed at
# /etc/nginx/conf.d/games-security-headers.conf — see the note in that file for
# why the headers are included per-location rather than set once here. The
# include path is ABSOLUTE on purpose: a relative include resolves against
# nginx's prefix, which differs between the official image and a distro
# package, and a wrong guess is a config that fails to load at all.
#
# TWO WAYS TO USE THIS FILE:
#
#   1. IN THE CONTAINER (deploy/Dockerfile), as written: plain HTTP on port 80,
#      with TLS terminated by whatever fronts the container.
#
#   2. ON THE DROPLET, alongside the id/rlc-api server blocks already there.
#      Uncomment the TLS block at the bottom and let
#      `certbot --nginx -d games.sparxstar.com` manage the certificate lines,
#      exactly as the engine's config is managed.
#
# NO SECRETS LIVE HERE. Nothing in this file, and nothing in the image it is
# baked into, holds a key, token, or credential — the site's configuration is
# three public URLs compiled into the bundle at build time. The dictionary
# credential lives ONLY in the BFF container this file proxies to, mounted
# there as a read-only file.
#
# The BFF's address is a compile-time `upstream` below rather than a variable,
# so a misconfigured environment cannot repoint this hop at an arbitrary host.

# The BFF container. `games-bff` is its service name on the compose network
# (deploy/docker-compose.yml); change it in one place if the topology changes.
upstream games_bff {
    server games-bff:8081;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name games.sparxstar.com;

    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the version.
    server_tokens off;

    # Static files and GET-only proxied reads; a request body is never read.
    client_max_body_size 1k;

    # HSTS belongs on the TLS block only — see the bottom of this file. Sent
    # over plain HTTP it is ignored, and in the container case there is no TLS
    # at this hop at all.

    # ---------------------------------------------------------------------
    # Source maps
    #
    # Built (hidden-source-map) so a stack trace can be symbolicated, never
    # served. This is a REGEX location, and it must be declared before the
    # prefix locations are reasoned about: nginx evaluates regex locations
    # after prefix ones but a regex match wins over a plain prefix match. The
    # /assets/ location below deliberately does NOT use `^~`, because `^~`
    # suppresses regex evaluation entirely and would serve every .map file.
    # ---------------------------------------------------------------------
    location ~ \.map$ {
        include /etc/nginx/conf.d/games-security-headers.conf;
        access_log off;
        return 404;
    }

    # ---------------------------------------------------------------------
    # Content-hashed assets — cached for a year, never revalidated.
    #
    # The filename changes whenever the bytes change, so a stale cached asset
    # can never be served for new content. `immutable` is what stops the
    # browser revalidating on reload; without it a refresh re-requests every
    # asset it already holds.
    #
    # `expires` is deliberately NOT used: it emits its own Cache-Control and
    # the response would carry two conflicting ones.
    # ---------------------------------------------------------------------
    location /assets/ {
        include /etc/nginx/conf.d/games-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        # A missing hashed asset must 404 rather than fall through to the SPA
        # fallback below. Returning index.html for a .js request is how
        # "Unexpected token '<'" reaches production.
        try_files $uri =404;
    }

    # ---------------------------------------------------------------------
    # index.html is the map to the hashed asset names. Caching it is how a
    # deploy half-lands: a stale index pointing at assets that no longer
    # exist. It must be revalidated every time.
    # ---------------------------------------------------------------------
    location = /index.html {
        include /etc/nginx/conf.d/games-security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # Container liveness. Answers without touching the filesystem.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---------------------------------------------------------------------
    # The games BFF — the ONLY proxied location on this host.
    #
    # A prefix match on an exact base path, not a regex and not a variable
    # upstream: the set of paths reachable through here is decided by the BFF's
    # own route table, and nothing a caller sends can influence which host is
    # dialled. `proxy_pass` with a URI part (`/api/dictionary/`) also means the
    # prefix is passed through unchanged rather than stripped, so the BFF sees
    # the same paths its table declares.
    # ---------------------------------------------------------------------
    location /api/dictionary/ {
        include /etc/nginx/conf.d/games-security-headers.conf;

        # Dictionary content carries rights and consent restrictions and can be
        # WITHDRAWN. Nothing on this path is cached at this hop, and the BFF
        # sets `no-store, private` on its own responses too.
        add_header Cache-Control "no-store, private" always;

        # Reads only. A write toward the Dictionary does not exist — it is a
        # read-only, DVE-governed source to every consumer — so anything but a
        # GET is refused here rather than forwarded.
        limit_except GET {
            deny all;
        }

        proxy_pass http://games_bff/api/dictionary/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # The BFF rate-limits per client, and reads the LAST X-Forwarded-For
        # hop — the one appended here. Setting it (rather than passing a
        # caller-supplied header through) is what makes that hop trustworthy.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Host $host;

        # Deliberately NOT forwarded: Authorization, Cookie, Origin, Referer.
        # The BFF authenticates itself, not the player, and the Dictionary
        # treats a browser-shaped header on a credentialed request as a
        # PRIORITY_1 event. Clearing them here means a header set by a page or
        # an extension cannot reach that far.
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header Origin "";
        proxy_set_header Referer "";

        # Shorter than the BFF's own upstream budget, so a stalled Dictionary
        # surfaces as the BFF's 503 rather than as a timeout here.
        proxy_connect_timeout 3s;
        proxy_send_timeout 10s;
        proxy_read_timeout 15s;

        proxy_buffering on;
        # The Dictionary caps a query response at 100 KB; this bounds what is
        # buffered whatever answers.
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
    }

    # ---------------------------------------------------------------------
    # SPA fallback. Any path that is not a real file is the application's own
    # route, so it gets index.html and the client router takes over. Declared
    # last so the more specific locations above win first.
    # ---------------------------------------------------------------------
    location / {
        include /etc/nginx/conf.d/games-security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}

# ---------------------------------------------------------------------------
# Droplet deployment (usage 2 above). Replace the plain-HTTP server block
# above with a redirect, and add this alongside it:
#
#   server {
#       listen 80;
#       listen [::]:80;
#       server_name games.sparxstar.com;
#       location /.well-known/acme-challenge/ { root /var/www/html; }
#       location / { return 301 https://$host$request_uri; }
#   }
#
#   server {
#       listen 443 ssl;
#       listen [::]:443 ssl;
#       http2 on;
#       server_name games.sparxstar.com;
#
#       ssl_certificate     /etc/letsencrypt/live/games.sparxstar.com/fullchain.pem;
#       ssl_certificate_key /etc/letsencrypt/live/games.sparxstar.com/privkey.pem;
#       ssl_protocols       TLSv1.2 TLSv1.3;
#       ssl_prefer_server_ciphers off;
#
#       add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
#
#       root /var/www/games.sparxstar.com;
#       index index.html;
#
#       # ...then the same location blocks as above, unchanged.
#   }
#
# Note the HSTS caveat: `add_header` in the server block is replaced by each
# location's own set, so Strict-Transport-Security must be added to
# games-security-headers.conf (not left on the server block) for a TLS
# deployment to actually send it on every response.
# ---------------------------------------------------------------------------
