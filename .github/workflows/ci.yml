name: CI

# Self-contained lint / format / build / test for this package.
#
# INTERIM: the platform `standards.yml` calls the org reusable workflows in
# starisian-technologies-coding-standards. Once those are published and green,
# they supersede this file — remove the overlapping jobs here to avoid
# duplicate enforcement (see the governance setup instructions, section 2).

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Format check
              run: pnpm run format:check

            - name: Lint
              run: pnpm run lint:ci

            - name: Build package (UMD)
              run: pnpm run build

            # The website is a separate target and can break on its own — it
            # bundles React instead of externalising it, compiles Tailwind, and
            # validates its endpoint configuration at build time. Building only
            # the package would let all of that rot unnoticed.
            - name: Build website
              run: pnpm run build:site

            - name: Test
              run: pnpm test

            # Cheap standing check that no credential was ever compiled into
            # the deployable bundle. The site's configuration is four public
            # URLs; anything key-shaped in dist-site/ is a mistake worth
            # failing the build over rather than discovering after it ships.
            - name: Assert no secrets in the website bundle
              run: |
                  if grep -rIlE '(sk_live|sk_test|-----BEGIN [A-Z ]*PRIVATE KEY|X-Api-Key)' dist-site/; then
                    echo "::error::Possible credential found in dist-site/"
                    exit 1
                  fi
                  echo "No credential patterns found in dist-site/."

            # Source maps are built for symbolicating crash reports and must
            # not be served. Nginx 404s them and the Dockerfile deletes them;
            # this just makes sure they are still findable at build time for
            # the release artifact rather than silently disabled.
            - name: Confirm source maps were emitted (for release artifacts)
              run: test -n "$(find dist-site -name '*.map' -print -quit)"
